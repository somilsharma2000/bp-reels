<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>BP Reels — Admin</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
<style>
  :root{
    --bg:#0b0b12; --card:#14141f; --card2:#1b1b2a; --line:#2a2a3d;
    --txt:#f2f2f7; --muted:#9a9ab0;
    --grad1:#7c3aed; --grad2:#ec4899;
    --green:#10b981; --amber:#f59e0b; --red:#ef4444;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",sans-serif;line-height:1.6;min-height:100vh}
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px}
  a{color:inherit}
  button{cursor:pointer;font-family:inherit}
  input,select,textarea{font-family:inherit;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:9px 12px;font-size:.9rem;width:100%}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--grad1)}
  label{display:block;font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}

  /* LOGIN */
  #login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
  .login-box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px;width:100%;max-width:360px;text-align:center}
  .login-box h1{font-size:1.3rem;margin-bottom:4px}
  .login-box p{color:var(--muted);font-size:.85rem;margin-bottom:20px}
  .btn{display:inline-block;border:none;border-radius:10px;padding:12px 20px;font-weight:700;font-size:.92rem;background:linear-gradient(90deg,var(--grad1),var(--grad2));color:#fff}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:var(--card2);border:1px solid var(--line);color:var(--txt)}
  .btn.small{padding:7px 12px;font-size:.8rem;border-radius:8px}
  .btn.danger{background:var(--card2);border:1px solid var(--red);color:var(--red)}
  .err{color:var(--red);font-size:.8rem;margin-top:10px;min-height:1.2em}

  /* APP */
  #app{display:none}
  header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
  .hbar{display:flex;align-items:center;justify-content:space-between;padding:14px 0;gap:10px;flex-wrap:wrap}
  .hbar h1{font-size:1.05rem}
  .hbar h1 span{background:linear-gradient(90deg,var(--grad1),var(--grad2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .tabs{display:flex;gap:6px}
  .tab{background:var(--card2);border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:8px 16px;font-weight:600;font-size:.85rem}
  .tab.on{background:linear-gradient(90deg,var(--grad1),var(--grad2));color:#fff;border-color:transparent}
  section{padding:28px 0 60px}
  h2{font-size:1.1rem;margin-bottom:16px}
  .stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:24px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  .stat b{font-size:1.5rem;display:block}
  .stat span{color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.05em}
  .stat.pending b{color:var(--amber)}

  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
  .card.pending{border-color:var(--amber)}
  .card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
  .card h3{font-size:1rem}
  .badge{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;border-radius:20px;padding:3px 10px;white-space:nowrap}
  .badge.active{background:rgba(16,185,129,.15);color:var(--green)}
  .badge.pending{background:rgba(245,158,11,.15);color:var(--amber)}
  .badge.paused{background:rgba(148,163,184,.15);color:#94a3b8}
  .badge.churned{background:rgba(239,68,68,.15);color:var(--red)}
  .badge.paid{background:rgba(16,185,129,.15);color:var(--green)}
  .badge.scheduled{background:rgba(124,58,237,.15);color:#a78bfa}
  .badge.posted{background:rgba(16,185,129,.15);color:var(--green)}
  .badge.failed{background:rgba(239,68,68,.15);color:var(--red)}
  .badge.skipped{background:rgba(148,163,184,.15);color:#94a3b8}
  .meta{color:var(--muted);font-size:.8rem;display:grid;gap:2px}
  .card .actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .empty{color:var(--muted);text-align:center;padding:50px 20px;background:var(--card);border:1px dashed var(--line);border-radius:14px}

  /* DETAIL VIEW */
  #detail{display:none}
  .back{color:var(--muted);font-size:.85rem;text-decoration:none;display:inline-block;margin-bottom:14px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:18px}
  .panel h3{font-size:.95rem;margin-bottom:14px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  @media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
  .row{margin-bottom:12px}
  .sync-note{font-size:.8rem;color:var(--muted);margin-top:6px}
  .queue-table{width:100%;border-collapse:collapse;font-size:.82rem}
  .queue-table th{color:var(--muted);text-transform:uppercase;font-size:.65rem;letter-spacing:.06em;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
  .queue-table td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  .queue-table .cap{color:var(--muted);font-size:.72rem;white-space:pre-wrap;max-width:340px}
  .queue-wrap{overflow-x:auto}
  .post-act{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .post-act button{background:var(--card2);border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:3px 8px;font-size:.7rem;font-weight:700}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--grad1);color:#fff;font-weight:600;font-size:.85rem;border-radius:12px;padding:12px 22px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:99;max-width:90vw;text-align:center}
  .toast.show{opacity:1}
  .toast.bad{background:var(--red)}
  .loader{color:var(--muted);text-align:center;padding:40px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-box">
    <div style="font-size:2rem">🎬</div>
    <h1>BP Reels <span style="color:var(--muted);font-weight:400">Admin</span></h1>
    <p>Only for the owner. Enter your admin password.</p>
    <input id="pw" type="password" placeholder="Admin password" onkeydown="if(event.key==='Enter')doLogin()">
    <div style="height:12px"></div>
    <button class="btn" style="width:100%" onclick="doLogin()">Open Dashboard</button>
    <div class="err" id="login-err"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div class="wrap hbar">
      <h1>BP <span>Reels</span> — Admin</h1>
      <div class="tabs">
        <button class="tab on" id="tab-cust" onclick="showTab('cust')">Customers</button>
        <button class="tab" id="tab-niche" onclick="showTab('niche')">Niches</button>
        <button class="tab" onclick="logout()">Logout</button>
      </div>
    </div>
  </header>

  <!-- CUSTOMERS -->
  <section id="view-cust" class="wrap">
    <div class="stats" id="stats"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap">
      <h2 style="margin:0">All Customers</h2>
      <button class="btn small" onclick="openEdit(null)">+ Add Customer</button>
    </div>
    <div class="cards" id="cust-cards"><div class="loader">Loading…</div></div>
  </section>

  <!-- CUSTOMER DETAIL -->
  <section id="detail" class="wrap">
    <a class="back" href="#" onclick="closeDetail();return false">← Back to all customers</a>
    <div class="panel" id="d-profile"></div>
    <div class="panel" id="d-queue"></div>
  </section>

  <!-- NICHES -->
  <section id="view-niche" class="wrap" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap">
      <h2 style="margin:0">Niches on the Website</h2>
      <button class="btn small" onclick="openNicheEdit(null)">+ Add Niche</button>
    </div>
    <p class="sync-note" style="margin-bottom:16px">These show up live on the landing page. Users pick one and sign up with it.</p>
    <div class="cards" id="niche-cards"><div class="loader">Loading…</div></div>
  </section>

  <div style="text-align:center;padding:20px;color:var(--muted);font-size:.75rem">BP Reels Admin · Beyond Pixells</div>
</div>

<div class="toast" id="toast"></div>

<!-- EDIT MODAL -->
<div id="modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:80;overflow:auto;padding:24px 16px">
  <div style="background:var(--card);border:1px solid var(--line);border-radius:16px;max-width:640px;margin:20px auto;padding:24px" id="modal-body"></div>
</div>

<script>
const API = "https://base44.app/api/apps/6a951232721dcd9fd8509a16/functions/adminApi";
let PW = localStorage.getItem("bp_admin_pw") || "";
let CURRENT = null; // customer currently open in detail view

function toast(msg, bad){
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = "toast show" + (bad ? " bad" : "");
  setTimeout(()=> t.className = "toast", 3200);
}

async function api(action, extra){
  const res = await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "application/json", "x-admin-key": PW },
    body: JSON.stringify(Object.assign({ action, password: PW }, extra || {}))
  });
  const data = await res.json();
  if (res.status === 401) { doLogout("Session expired — log in again."); throw new Error("auth"); }
  if (!res.ok) { toast(data.error || "Something went wrong", true); throw new Error(data.error); }
  return data;
}

/* ---------- LOGIN ---------- */
function doLogin(){
  PW = document.getElementById("pw").value.trim();
  if (!PW) return;
  api("dashboard").then(() => {
    localStorage.setItem("bp_admin_pw", PW);
    document.getElementById("login").style.display = "none";
    document.getElementById("app").style.display = "block";
    loadDashboard();
  }).catch(()=> document.getElementById("login-err").textContent = "Wrong password. Try again.");
}
function doLogout(msg){
  localStorage.removeItem("bp_admin_pw"); PW = "";
  document.getElementById("app").style.display = "none";
  document.getElementById("detail").style.display = "none";
  document.getElementById("login").style.display = "flex";
  if (msg) document.getElementById("login-err").textContent = msg;
}
function logout(){ if(confirm("Log out of admin?")) doLogout(); }

/* ---------- TABS ---------- */
function showTab(tab){
  document.getElementById("tab-cust").classList.toggle("on", tab==="cust");
  document.getElementById("tab-niche").classList.toggle("on", tab==="niche");
  document.getElementById("view-niche").style.display = tab==="niche" ? "block" : "none";
  document.getElementById("detail").style.display = "none";
  document.getElementById("view-cust").style.display = "block";
  if (tab === "cust") loadDashboard();
  if (tab === "niche") loadNiches();
}

/* ---------- CUSTOMERS ---------- */
async function loadDashboard(){
  const { customers, summary } = await api("dashboard");
  const el = document.getElementById("cust-cards");
  const st = document.getElementById("stats");
  const act = customers.filter(c=>c.status==="active").length;
  const pend = customers.filter(c=>c.status==="pending").length;
  const mrr = customers.filter(c=>c.status==="active" && c.payment_status==="paid").reduce((s,c)=>s+(c.plan_price||0),0);
  st.innerHTML = `
    <div class="stat"><b>${customers.length}</b><span>Total customers</span></div>
    <div class="stat pending"><b>${pend}</b><span>Awaiting payment</span></div>
    <div class="stat"><b>${act}</b><span>Active</span></div>
    <div class="stat"><b>₹${mrr.toLocaleString("en-IN")}</b><span>Confirmed MRR</span></div>`;
  if (!customers.length){
    el.innerHTML = '<div class="empty">No customers yet.<br><br><button class="btn small" onclick="openEdit(null)">+ Add your first customer</button></div>';
    return;
  }
  customers.sort((a,b)=> (a.status==="pending"?0:1)-(b.status==="pending"?0:1) || (b.created_date||"").localeCompare(a.created_date||""));
  el.innerHTML = customers.map(c=>{
    const s = summary[c.id] || { scheduled: 0, next_post: null };
    const next = s.next_post ? `${s.next_post.post_date} at ${s.next_post.post_time}` : "not scheduled yet";
    return `<div class="card ${c.status==="pending"?"pending":""}">
      <div class="top"><h3>${esc(c.name)}</h3><span class="badge ${c.status}">${c.status}</span></div>
      <div class="meta">
        <span>📱 ${esc(c.whatsapp||"—")}</span>
        <span>🎯 ${esc(c.niche||"—")} · ₹${(c.plan_price||0).toLocaleString("en-IN")}/mo · <span class="badge ${c.payment_status}" style="font-size:.62rem">${c.payment_status}</span></span>
        <span>⏰ ${esc(c.posting_time||"—")} IST · 📅 ${s.scheduled} scheduled</span>
        <span>➡️ Next: ${next}</span>
      </div>
      <div class="actions">
        <button class="btn small" onclick="openDetail('${c.id}')">Open Profile</button>
        ${c.status==="pending" ? `<button class="btn small" style="background:var(--green)" onclick="markPaid('${c.id}')">✓ Payment Received</button>` : ""}
      </div>
    </div>`;
  }).join("");
}

async function markPaid(id){
  if (!confirm("Mark payment as received and activate this customer?")) return;
  const { customer } = await api("get_customer", { customer_id: id });
  await api("save_customer", { customer_id: id, customer: Object.assign({}, customer, { status: "active", payment_status: "paid" }) });
  toast("Customer activated 🎉");
  loadDashboard();
}

function closeDetail(){ document.getElementById("detail").style.display = "none"; document.getElementById("view-cust").style.display = "block"; }

async function openDetail(id){
  const { customer: c, posts } = await api("get_customer", { customer_id: id });
  CURRENT = c;
  document.getElementById("view-cust").style.display = "none";
  document.getElementById("detail").style.display = "block";
  window.scrollTo(0,0);

  const p = document.getElementById("d-profile");
  p.innerHTML = `
    <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px">
      <h3 style="margin:0">${esc(c.name)} <span class="badge ${c.status}">${c.status}</span> <span class="badge ${c.payment_status}">${c.payment_status}</span></h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn small ghost" onclick="openEdit('${c.id}')">✏️ Edit</button>
        <a class="btn small ghost" href="https://wa.me/${(c.whatsapp||"").replace(/\\D/g,"")}" target="_blank" rel="noopener">💬 WhatsApp</a>
        <button class="btn small danger" onclick="delCustomer('${c.id}')">Delete</button>
      </div>
    </div>
    <div class="grid3">
      <div class="meta"><span>📱 WhatsApp</span><b style="color:var(--txt);font-size:.95rem">${esc(c.whatsapp||"—")}</b></div>
      <div class="meta"><span>✉️ Email</span><b style="color:var(--txt);font-size:.95rem">${esc(c.email||"—")}</b></div>
      <div class="meta"><span>🎯 Niche</span><b style="color:var(--txt);font-size:.95rem">${esc(c.niche||"—")}</b></div>
      <div class="meta"><span>📸 Instagram</span><b style="color:var(--txt);font-size:.95rem">${esc(c.insta_handle||"—")}</b></div>
      <div class="meta"><span>▶️ YouTube</span><b style="color:var(--txt);font-size:.95rem">${esc(c.yt_handle||"—")}</b></div>
      <div class="meta"><span>⏰ Posting time</span><b style="color:var(--txt);font-size:.95rem">${esc(c.posting_time||"—")} IST</b></div>
      <div class="meta"><span>💰 Plan</span><b style="color:var(--txt);font-size:.95rem">₹${(c.plan_price||0).toLocaleString("en-IN")}/mo</b></div>
      <div class="meta"><span>📅 Joined</span><b style="color:var(--txt);font-size:.95rem">${(c.created_date||"").slice(0,10)}</b></div>
      <div class="meta"><span>📝 Notes</span><b style="color:var(--txt);font-size:.85rem;font-weight:400">${esc(c.notes||"—")}</b></div>
    </div>
    <div style="margin-top:14px">
      <label>Customer's Drive folder link (set to "Anyone with the link – Viewer")</label>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <input id="folder-url" value="${esc(c.drive_folder_url||"")}" placeholder="https://drive.google.com/drive/folders/…" style="flex:1;min-width:220px">
        <button class="btn small" onclick="saveFolder()">Save</button>
        <button class="btn small" style="background:var(--green)" onclick="syncFolder(this)">🔄 Sync & Auto-Schedule</button>
      </div>
      <p class="sync-note">Sync reads the videos in their folder and fills the next 30 days with posts + captions automatically.</p>
    </div>`;

  const q = document.getElementById("d-queue");
  if (!posts.length){
    q.innerHTML = `<h3>Post Queue</h3><div class="empty">No posts scheduled yet.<br>Save a Drive folder link above, then hit <b>Sync & Auto-Schedule</b>.</div>`;
  } else {
    q.innerHTML = `<h3>Post Queue (${posts.length})</h3><div class="queue-wrap"><table class="queue-table">
      <tr><th>Date</th><th>Time</th><th>Video</th><th>Caption</th><th>Status</th></tr>
      ${posts.map(p2=>`<tr>
        <td>${p2.post_date}</td><td>${p2.post_time}</td>
        <td>${esc(p2.video_name)}</td>
        <td class="cap">${esc(p2.caption)}</td>
        <td><span class="badge ${p2.status}">${p2.status}</span>
          <div class="post-act">
            <button onclick="setPost('${p2.id}','posted')">✓ posted</button>
            <button onclick="setPost('${p2.id}','failed')">✕ failed</button>
            <button onclick="setPost('${p2.id}','scheduled')">↺ re-queue</button>
          </div></td>
      </tr>`).join("")}
    </table></div>`;
  }
}

async function saveFolder(){
  await api("save_customer", { customer_id: CURRENT.id, customer: Object.assign({}, CURRENT, { drive_folder_url: document.getElementById("folder-url").value.trim() }) });
  toast("Folder link saved");
  openDetail(CURRENT.id);
}

async function syncFolder(btn){
  btn.textContent = "Syncing…"; btn.disabled = true;
  try {
    const r = await api("sync_customer", { customer_id: CURRENT.id });
    toast(`Added ${r.added} posts (from ${r.videos} videos) 🎉`);
    openDetail(CURRENT.id);
  } catch(e) { btn.textContent = "🔄 Sync & Auto-Schedule"; btn.disabled = false; }
}

async function setPost(id, status){
  await api("update_post", { post_id: id, status });
  toast("Marked as " + status);
  openDetail(CURRENT.id);
}

async function delCustomer(id){
  if (!confirm("Delete this customer and all their scheduled posts? This cannot be undone.")) return;
  await api("delete_customer", { customer_id: id });
  toast("Deleted");
  closeDetail(); loadDashboard();
}

/* ---------- ADD / EDIT CUSTOMER ---------- */
function openEdit(id){
  const isNew = !id;
  const body = document.getElementById("modal-body");
  document.getElementById("modal").style.display = "block";
  body.innerHTML = `<div class="loader">Loading…</div>`;
  const fill = (c)=>{
    body.innerHTML = `
      <h3 style="margin-bottom:16px">${isNew ? "Add Customer" : "Edit — " + esc(c.name)}</h3>
      <div class="grid2">
        <div class="row"><label>Name *</label><input id="f-name" value="${esc(c.name||"")}"></div>
        <div class="row"><label>WhatsApp *</label><input id="f-whatsapp" value="${esc(c.whatsapp||"")}" placeholder="91…"></div>
        <div class="row"><label>Email</label><input id="f-email" value="${esc(c.email||"")}"></div>
        <div class="row"><label>Niche</label><input id="f-niche" value="${esc(c.niche||"")}" placeholder="gym, salon, cafe…"></div>
        <div class="row"><label>Instagram handle</label><input id="f-insta" value="${esc(c.insta_handle||"")}"></div>
        <div class="row"><label>YouTube channel</label><input id="f-yt" value="${esc(c.yt_handle||"")}"></div>
        <div class="row"><label>Posting time (IST)</label><input id="f-time" type="time" value="${esc(c.posting_time||"19:00")}"></div>
        <div class="row"><label>Plan price (₹/mo)</label><input id="f-price" type="number" value="${c.plan_price||1999}"></div>
        <div class="row"><label>Payment status</label><select id="f-pay"><option ${c.payment_status==="pending"?"selected":""}>pending</option><option ${c.payment_status==="paid"?"selected":""}>paid</option><option ${c.payment_status==="failed"?"selected":""}>failed</option><option ${c.payment_status==="refund"?"selected":""}>refund</option></select></div>
        <div class="row"><label>Account status</label><select id="f-status"><option ${c.status==="pending"?"selected":""}>pending</option><option ${c.status==="active"?"selected":""}>active</option><option ${c.status==="paused"?"selected":""}>paused</option><option ${c.status==="churned"?"selected":""}>churned</option></select></div>
      </div>
      <div class="row"><label>Drive folder link</label><input id="f-folder" value="${esc(c.drive_folder_url||"")}" placeholder="https://drive.google.com/drive/folders/…"></div>
      <div class="row"><label>Notes</label><textarea id="f-notes" rows="2">${esc(c.notes||"")}</textarea></div>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:8px">
        <button class="btn ghost" onclick="closeModal()">Cancel</button>
        <button class="btn" onclick="saveCustomer(${isNew ? "null" : "'" + id + "'"})">${isNew ? "Add Customer" : "Save Changes"}</button>
      </div>`;
  };
  if (isNew) fill({});
  else api("get_customer", { customer_id: id }).then(d => fill(d.customer));
}

function closeModal(){ document.getElementById("modal").style.display = "none"; }

async function saveCustomer(id){
  const customer = {
    name: val("f-name"), whatsapp: val("f-whatsapp"), email: val("f-email"), niche: val("f-niche"),
    insta_handle: val("f-insta"), yt_handle: val("f-yt"), posting_time: val("f-time"),
    plan_price: Number(val("f-price")) || 1999, payment_status: val("f-pay"), status: val("f-status"),
    drive_folder_url: val("f-folder"), notes: val("f-notes"),
  };
  if (!customer.name) { toast("Name is required", true); return; }
  await api("save_customer", id ? { customer_id: id, customer } : { customer });
  toast(id ? "Saved" : "Customer added");
  closeModal();
  if (CURRENT && id === CURRENT.id) openDetail(id); else loadDashboard();
}

/* ---------- NICHES ---------- */
async function loadNiches(){
  const res = await fetch(API, { method:"POST", headers:{ "Content-Type":"application/json", "x-admin-key": PW },
    body: JSON.stringify({ action: "list_niches", password: PW }) });
  const data = await res.json();
  const el = document.getElementById("niche-cards");
  if (!data.niches || !data.niches.length){ el.innerHTML = '<div class="empty">No niches yet.</div>'; return; }
  el.innerHTML = data.niches.map(n=>`
    <div class="card">
      <div class="top"><h3>${esc(n.name)}</h3><span class="badge ${n.active ? "active" : "paused"}">${n.active ? "live" : "hidden"}</span></div>
      <div class="meta"><span>/${esc(n.slug)} · ₹${(n.price||0).toLocaleString("en-IN")}/mo</span><span>${esc(n.description||"")}</span></div>
      <div class="actions">
        <button class="btn small ghost" onclick="openNicheEdit('${n.id}')">Edit</button>
        <button class="btn small ghost" onclick="toggleNiche('${n.id}',${!n.active})">${n.active ? "Hide from site" : "Show on site"}</button>
        <button class="btn small danger" onclick="delNiche('${n.id}')">Delete</button>
      </div>
    </div>`).join("");
}

function openNicheEdit(id){
  const isNew = !id;
  const body = document.getElementById("modal-body");
  document.getElementById("modal").style.display = "block";
  body.innerHTML = `
    <h3 style="margin-bottom:16px">${isNew ? "Add Niche" : "Edit Niche"}</h3>
    <div class="grid2">
      <div class="row"><label>Display name *</label><input id="n-name" placeholder="Gym & Fitness"></div>
      <div class="row"><label>Slug (one word) *</label><input id="n-slug" placeholder="gym"></div>
      <div class="row"><label>Price (₹/mo)</label><input id="n-price" type="number" value="1999"></div>
      <div class="row"><label>On the website?</label><select id="n-active"><option value="yes">Yes — live</option><option value="no">No — hidden</option></select></div>
    </div>
    <div class="row"><label>Short description (card line)</label><input id="n-desc" placeholder="Workout clips that make fitness pages blow up"></div>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn" onclick="saveNiche(${isNew?"null":"'"+id+"'"})">Save Niche</button>
    </div>`;
}
async function saveNiche(id){
  const niche = {
    name: val("n-name"), slug: val("n-slug"), price: Number(val("n-price")) || 1999,
    description: val("n-desc"), active: val("n-active") === "yes",
  };
  if (!niche.name || !niche.slug) { toast("Name and slug required", true); return; }
  await api("save_niche", id ? { niche_id: id, niche } : { niche });
  toast("Saved — website updates instantly");
  closeModal(); loadNiches();
}
async function toggleNiche(id, active){
  const res = await fetch(API, { method:"POST", headers:{ "Content-Type":"application/json", "x-admin-key": PW }, body: JSON.stringify({ action: "list_niches", password: PW }) });
  const data = await res.json();
  const n = (data.niches||[]).find(x=>x.id===id);
  if (!n) return;
  await api("save_niche", { niche_id: id, niche: Object.assign({}, n, { active }) });
  toast(active ? "Now live on the site" : "Hidden from the site");
  loadNiches();
}
async function delNiche(id){
  if (!confirm("Delete this niche from the website?")) return;
  await api("delete_niche", { niche_id: id });
  toast("Deleted"); loadNiches();
}

/* ---------- HELPERS ---------- */
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function val(id){ return (document.getElementById(id).value || "").trim(); }

/* ---------- BOOT ---------- */
if (PW) {
  api("dashboard").then(()=>{
    document.getElementById("login").style.display = "none";
    document.getElementById("app").style.display = "block";
    loadDashboard();
  }).catch(()=>{});
}
document.getElementById("modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
</script>
